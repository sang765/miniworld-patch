name: cf-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: try curl_cffi (TLS impersonation, no JS)
        run: |
          pip install curl_cffi
          python - <<'PY'
          import re, pathlib
          from curl_cffi import requests
          url = "https://www.apkmirror.com/apk/minovate-hong-kong-limited/mini-world-block-art/mini-world-block-art-1-7-15-release/mini-world-creata-1-7-15-android-apk-download/"
          r = requests.get(url, impersonate="chrome", timeout=60)
          pathlib.Path("/tmp/probe1.html").write_text(r.text)
          m = re.findall(r'/apk/[^"]*/download/\?key=[0-9a-f]+', r.text)
          print("curl_cffi status:", r.status_code, "bytes:", len(r.content))
          print("curl_cffi title:", re.findall(r'<title>(.*?)</title>', r.text, re.I)[:1])
          print("curl_cffi links:", m[:3])
          PY

      - name: try headless chromium (solves the interstitial)
        run: |
          npx -y playwright@1.49 install --with-deps chromium >/dev/null 2>&1
          python - <<'PY'
          import json, re, subprocess, textwrap, pathlib
          script = textwrap.dedent('''
            const { chromium } = require('playwright');
            (async () => {
              const b = await chromium.launch({ headless: true });
              const p = await b.newPage();
              const url = "https://www.apkmirror.com/apk/minovate-hong-kong-limited/mini-world-block-art/mini-world-block-art-1-7-15-release/mini-world-creata-1-7-15-android-apk-download/";
              await p.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              for (let i = 0; i < 20; i++) {
                const links = await p.$$eval('a[href*="/download/?key="]', as => as.map(a => a.getAttribute('href')));
                if (links.length) { console.log(JSON.stringify({ok: true, links: links.slice(0, 3)})); await b.close(); return; }
                const title = await p.title();
                if (!/just a moment/i.test(title) && i > 3) break;
                await p.waitForTimeout(2000);
              }
              const title = await p.title();
              console.log(JSON.stringify({ok: false, title}));
              await b.close();
            })();
          ''')
          pathlib.Path('/tmp/probe2.js').write_text(script)
          out = subprocess.run(
              ['npx', '-y', 'playwright@1.49', 'install', '--with-deps', 'chromium'],
              capture_output=True, text=True, timeout=600)
          # playwright needs the package resolvable: install it locally
          subprocess.run(['npm', 'init', '-y'], cwd='/tmp', capture_output=True)
          subprocess.run(['npm', 'install', 'playwright@1.49'], cwd='/tmp',
                         capture_output=True, text=True, timeout=600)
          out = subprocess.run(['node', '/tmp/probe2.js'], cwd='/tmp',
                               capture_output=True, text=True, timeout=300)
          print("stdout:", out.stdout.strip())
          print("stderr tail:", out.stderr.strip()[-800:])
          PY
