name: cf-probe2

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: resolve download.php and test both transfer paths
        run: |
          pip install curl_cffi
          python - <<'PY'
          import re, subprocess, pathlib
          from curl_cffi import requests

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36")
          page = ("https://www.apkmirror.com/apk/minovate-hong-kong-limited/"
                  "mini-world-block-art/mini-world-block-art-1-7-15-release/"
                  "mini-world-creata-1-7-15-android-apk-download/")

          s = requests.Session(impersonate="chrome", headers={"User-Agent": UA})
          r = s.get(page, timeout=60)
          key = re.findall(r'/apk/[^"]*/download/\?key=[0-9a-f]+', r.text)
          print("step1 page:", r.status_code, "links:", len(key))
          r2 = s.get("https://www.apkmirror.com" + key[0], timeout=60)
          direct = re.findall(r'/wp-content/themes/APKMirror/download\.php\?id=\d+&key=[0-9a-f]+', r2.text)
          print("step2 landing:", r2.status_code, "direct:", direct[:1])

          # (a) plain curl against download.php, no impersonation
          url = "https://www.apkmirror.com" + direct[0]
          out = subprocess.run(
              ["curl", "-sSIL", "-A", UA, "--max-time", "60", url],
              capture_output=True, text=True)
          head = out.stdout.splitlines()
          print("step3a plain-curl rc:", out.returncode)
          for line in head:
              if line.lower().startswith(("http/", "location:", "content-length:")):
                  print("   ", line[:160])

          # (b) curl_cffi HEAD against download.php - does it redirect to R2?
          h = s.head(url, allow_redirects=False, timeout=60)
          loc = h.headers.get("Location", "")
          print("step3b cffi-head:", h.status_code, "location_host:",
                loc.split("/")[2] if "//" in loc else "<none>")

          # (c) plain curl against the R2 URL (the real payload transfer)
          if loc:
              out = subprocess.run(
                  ["curl", "-sS", "-o", "/dev/null", "-w",
                   "%{http_code} %{size_download} %{speed_download}", "--max-time", "45",
                   "-r", "0-1048575", loc],
                  capture_output=True, text=True)
              print("step3c plain-curl ranged on R2:", out.stdout.strip(),
                    "rc:", out.returncode, out.stderr.strip()[:200])
          PY
