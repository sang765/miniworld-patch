name: b4-decodeonly

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: >-
          Optional override: an APKMirror release page (or a /download/?key=
          link). Leave empty to use the release page pinned in scripts/env.sh.
        required: false
        default: ""

permissions:
  contents: write

# builds share a single release tag, so never let two run at once
concurrency:
  group: miniworld-mod-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # source (874M) + two decodes + rebuilt splits + bundle land near 7GB
    timeout-minutes: 240
    env:
      SOURCE_URL: ${{ inputs.source_url }}
    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: select build-tools
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/aapt2" version
          "$BT/apksigner" --version
          echo "$BT" >> "$GITHUB_PATH"

      - name: cache apktool
        id: apktool-cache
        uses: actions/cache@v4
        with:
          path: tools/apktool.jar
          key: apktool-3.0.3

      - name: download apktool
        if: steps.apktool-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools
          curl -fsSL --retry 3 -o tools/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar

      - name: pin apktool
        # The pipeline was developed against a Termux build reporting
        # "3.0.3-dirty"; this is the official 3.0.3. scripts/verify.sh does not
        # compare the two builds - it holds each one to the same spec, which is
        # the part that actually matters for the shipped artifact.
        run: |
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  tools/apktool.jar" \
            | sha256sum -c -
          java -jar tools/apktool.jar --version

      - name: decode signing key
        env:
          APK_KEYSTORE: ${{ secrets.APK_KEYSTORE }}
          APK_KEYSTORE_PASS: ${{ secrets.APK_KEYSTORE_PASS }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASS: ${{ secrets.APK_KEY_PASS }}
        run: |
          if [ -z "$APK_KEYSTORE" ] || [ -z "$APK_KEYSTORE_PASS" ]; then
            echo "::error::set APK_KEYSTORE (base64 .jks) and APK_KEYSTORE_PASS"
            exit 1
          fi
          umask 077
          printf '%s' "$APK_KEYSTORE" | base64 -d > "$RUNNER_TEMP/modkey.jks"
          # wrong password must fail here, not after a 40 minute build
          keytool -list -keystore "$RUNNER_TEMP/modkey.jks" \
            -storepass "$APK_KEYSTORE_PASS" -alias "${APK_KEY_ALIAS:-mod}" >/dev/null
          {
            echo "KS=$RUNNER_TEMP/modkey.jks"
            echo "KS_ALIAS=${APK_KEY_ALIAS:-mod}"
            echo "KS_PASS=$APK_KEYSTORE_PASS"
            echo "KS_KEY_PASS=${APK_KEY_PASS:-$APK_KEYSTORE_PASS}"
          } >> "$GITHUB_ENV"

